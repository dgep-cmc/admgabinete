<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Composição — Diego Martins</title>
<script src="/jspdf.umd.min.js"></script>
<style>
:root{--fundo:#F2F3F1;--sup:#fff;--tinta:#182528;--mut:#5A6B6B;--linha:#D9DEDB;--verde:#0E4D36;--verde2:#E6F0EB;--erro:#B42318;--ok:#0E4D36;--fonte:"Helvetica Neue",Helvetica,Roboto,Arial,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{font-family:var(--fonte);margin:0;background:var(--fundo);color:var(--tinta);-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 40px}
.topo{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--linha)}
.topo small{font-size:12px;letter-spacing:.06em;color:var(--mut);font-family:var(--fonte)}
.topo strong{font-family:var(--fonte);font-size:20px;font-weight:700;white-space:nowrap;letter-spacing:-.01em}
h1{font-family:var(--fonte);font-size:28px;line-height:1.1;margin:20px 0 4px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:14px;margin:0 0 18px}
.lista{background:var(--sup);border:1px solid var(--linha)}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--linha)}
.row:last-child{border-bottom:0}
.nome{flex:1;min-width:0}
.nome b{font-size:14px;font-weight:600;display:block}
.nome span{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:6px;width:114px;justify-content:center;flex-shrink:0}
.step.fixo input{border:1px solid transparent;background:transparent}
.step button{width:36px;height:34px;border:1px solid var(--linha);background:#fff;font-size:18px;line-height:1;cursor:pointer;border-radius:2px}
.step button:active{background:var(--verde2)}
.step input{width:42px;height:34px;text-align:center;border:1px solid var(--linha);font-variant-numeric:tabular-nums;font-size:15px;border-radius:2px}
.resumo{margin-top:16px;background:#fff;border:1px solid var(--linha);padding:16px 14px}
.resumo .nums{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--mut)}
.barra{height:4px;background:#E8ECEA;margin-top:12px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);width:0%;transition:width .18s}
.barra.i i{background:var(--erro)}
.msg{margin-top:10px;font-size:13px;font-weight:600}
.msg.ok{color:var(--ok)} .msg.err{color:var(--erro)}
.acoes{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.acoes button{height:44px;padding:0 18px;border-radius:2px;border:1px solid var(--verde);background:var(--verde);color:#fff;font-weight:600;cursor:pointer;font-family:var(--fonte)}
.acoes button:disabled{opacity:.45;cursor:not-allowed;background:#fff;color:var(--verde)}
.acoes .ghost{background:#fff;color:var(--verde)}
.menu{display:flex;gap:18px;padding:14px 0;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.menu a{font-size:14px;font-weight:600;color:var(--tinta);text-decoration:none}
.menu a.ativo{color:var(--verde);border-bottom:2px solid var(--verde);padding-bottom:2px}
.titulo-linha{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.btn-enviar{height:44px;padding:0 16px;border-radius:2px;border:1px solid var(--verde);background:#fff;color:var(--verde);font-weight:600;cursor:pointer;font-family:var(--fonte);white-space:nowrap;margin-top:20px;flex-shrink:0}
.titulo-lista{font-size:13px;font-weight:700;margin:18px 0 8px}
.lista-salvos{display:flex;flex-direction:column;gap:8px}
.pedido{border:1px solid var(--linha);background:#fff;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:space-between}
.pedido:hover{border-color:var(--verde)}
.pedido .info{flex:1;min-width:0}
.pedido b{font-size:14px;display:block}
.pedido span{font-size:12px;color:var(--mut)}
.btn-excluir{height:32px;padding:0 10px;border:1px solid var(--linha);background:#fff;color:var(--erro);font-family:var(--fonte);font-weight:600;font-size:12px;cursor:pointer;flex-shrink:0}
@media(max-width:560px){.topo strong{font-size:18px}h1{font-size:24px}.nome span{display:none}}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<div class="topo"><small>Câmara Municipal de Curitiba</small><strong>Diego Martins</strong></div>
<nav class="menu"><a href="/portal-diego-martins.html">Início</a><a class="ativo" href="/gabinete-diego-martins.html">Composição do Gabinete</a><a href="/exoneracao-diego-martins.html">Exoneração de Servidor</a></nav>
<div class="titulo-linha">
<div><h1>Composição</h1>
<p class="sub">Gabinete parlamentar</p></div>
<button id="enviar" type="button" class="btn-enviar">Enviar requerimento</button>
</div>

<div class="lista" id="lista"></div>

<div class="resumo">
<div class="nums">
<div><div class="small">Pessoas</div><div class="big" id="pessoas">0</div></div>
<div><div class="small">Total</div><div class="big">R$ <span id="total">0,00</span></div></div>
<div><div class="small">Limite</div><div class="big" style="font-size:16px;padding-top:4px">R$ 92.998,45</div></div>
</div>
<div class="barra" id="barra"><i></i></div>
<div class="msg ok" id="msg">Composição válida.</div>
<div class="acoes">
<button id="salvar">Salvar composição</button>
<button id="pdf">Gerar PDF</button>
<button class="ghost" id="zerar" type="button">Zerar</button>
</div>
<div class="titulo-lista">Composições salvas</div>
<div class="lista-salvos" id="listaSalvos"></div>
</div>
</div>

<script>
const cargos=[
{n:'Chefe de Gabinete',s:'CC1',v:18599.66},
{n:'Assessor de Gabinete',s:'CC2',v:16533.01},
{n:'Assessor de Gabinete',s:'CC3',v:14466.48},
{n:'Assessor de Gabinete',s:'CC4',v:12399.85},
{n:'Assessor de Gabinete',s:'CC5',v:10333.14},
{n:'Assessor de Gabinete',s:'CC6',v:8266.53},
{n:'Assessor de Gabinete',s:'CC7',v:6199.89},
{n:'Assessor de Gabinete',s:'CC8',v:4133.19},
{n:'Assessor de Gabinete',s:'CC9',v:3099.98}];
cargos.forEach(c=>c.q=0);cargos[0].q=1;
const LIM=92998.45;
const MAX_PESSOAS=9;
const lista=document.getElementById('lista');
const fmt=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function totalPessoas(){return cargos.reduce((a,c)=>a+c.q,0)}
function invalido(){
const total=cargos.reduce((a,c)=>a+c.q*c.v,0);
return cargos[0].q!==1||totalPessoas()>MAX_PESSOAS||total>LIM;
}
function render(){
cargos[0].q=1;
lista.innerHTML='';
const pessoasNow=totalPessoas();
cargos.forEach(c=>{
const row=document.createElement('div');row.className='row';
const nome=document.createElement('div');nome.className='nome';
nome.innerHTML=`<b>${c.n} <span style="color:#999;font-weight:400">${c.s}</span></b><span>R$ ${fmt(c.v)}</span>`;
const step=document.createElement('div');step.className='step';
if(c.s==='CC1'){
step.classList.add('fixo');
const inp=document.createElement('input');inp.value=1;inp.readOnly=true;inp.setAttribute('aria-label','Quantidade fixa');
step.appendChild(inp);
}else{
const m=document.createElement('button');m.type='button';m.textContent='−';m.setAttribute('aria-label','Diminuir');
const inp=document.createElement('input');inp.value=c.q;inp.readOnly=true;
const p=document.createElement('button');p.type='button';p.textContent='+';p.setAttribute('aria-label','Aumentar');
m.onclick=()=>{c.q=Math.max(0,c.q-1);render()};
p.onclick=()=>{if(totalPessoas()>=MAX_PESSOAS)return;c.q++;render()};
p.disabled=pessoasNow>=MAX_PESSOAS;
if(m.disabled===undefined){} 
step.append(m,inp,p);
}
row.append(nome,step);lista.appendChild(row);
});
const pessoas=totalPessoas();
const total=cargos.reduce((a,c)=>a+c.q*c.v,0);
document.getElementById('pessoas').textContent=pessoas;
document.getElementById('total').textContent=fmt(total);
const pct=Math.min(100,total/LIM*100);
document.querySelector('#barra i').style.width=pct+'%';
const inv=invalido();
document.getElementById('barra').className='barra'+(inv?' i':'');
const msg=document.getElementById('msg');
if(pessoas>MAX_PESSOAS){msg.textContent='Máximo de 9 pessoas.';msg.className='msg err'}
else if(total>LIM){msg.textContent='Limite excedido.';msg.className='msg err'}
else{msg.textContent='Composição válida.';msg.className='msg ok'}
document.getElementById('salvar').disabled=inv;
document.getElementById('pdf').disabled=inv;
}
const CHAVE='composicao-diego-martins-lista';
let atualId=null;
function lerLista(){try{return JSON.parse(localStorage.getItem(CHAVE)||'[]')}catch(e){return[]}}
function gravarLista(a){localStorage.setItem(CHAVE,JSON.stringify(a))}
function fmtSalvo(iso){try{const d=new Date(iso);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return''}}
/* ===== BASE FORMS + PLANILHA UNIFICADA (para o Gemini criar) =====
   Peça ao Gemini para criar:
   1. Um Google Forms por tipo (Composição, Exoneração) OU um único Forms com campo Tipo.
   2. Uma Planilha ÚNICA para todos os vereadores, com respostas do Forms.
   Colunas do Forms/Planilha (ordem):
     A: Gabinete (ex.: DIEGO MARTINS)
     B: Tipo (Composição | Exoneração | ... )
     C: Data/hora de chegada (auto, do Forms)
     D: Link do PDF no Drive (upload do Forms salvo no Drive)
     E+: demais campos específicos do pedido (nome, matrícula, cargo, símbolo, etc.)
   Organização: cada resposta entra na primeira linha em branco, ordenada pela data de chegada.
   Depois de criado, cole abaixo o link publicado do Forms em FORM_URL.
*/
const GABINETE='VER. DIEGO MARTINS';
const TIPO='Composição';
const FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLSd6LMIcKR21tUQ0IYhZKFdIrm6kP8-RW2VKT4CNYVD3n287gg/viewform?usp=dialog'; // TODO Gemini: colar link do Forms aqui (ex.: https://docs.google.com/forms/d/e/.../viewform)
document.getElementById('enviar').onclick=()=>{
if(!FORM_URL){const m=document.getElementById('msg');m.textContent='Form ainda não configurado.';m.className='msg err';alert('Form ainda não configurado. Solicite ao Gemini a criação do Forms + Planilha + Drive.');return}
window.open(FORM_URL,'_blank');
};
function renderLista(){
const el=document.getElementById('listaSalvos');el.innerHTML='';
const arr=lerLista();
if(arr.length===0){el.innerHTML='<div class="pedido" style="cursor:default">Nenhuma composição salva.</div>';return}
arr.forEach(it=>{
const pessoas=Object.values(it.cargos||{}).reduce((a,v)=>a+(+v||0),0);
const total=Object.entries(it.cargos||{}).reduce((a,[s,q])=>{const c=cargos.find(x=>x.s===s);return a+(c?(+q||0)*c.v:0)},0);
const d=document.createElement('div');d.className='pedido';
const info=document.createElement('div');info.className='info';
info.innerHTML=`<b>${pessoas} pessoas — R$ ${fmt(total)}</b><span>salvo em ${fmtSalvo(it.salvoEm)}</span>`;
const del=document.createElement('button');del.type='button';del.className='btn-excluir';del.textContent='Excluir';
del.onclick=e=>{
e.stopPropagation();
if(!confirm('Tem certeza que deseja excluir?'))return;
const atual=lerLista().filter(x=>x.id!==it.id);gravarLista(atual);
if(atualId===it.id){atualId=null;cargos.forEach(c=>c.q=0);cargos[0].q=1;render()}
renderLista();
};
d.append(info,del);
d.onclick=()=>{atualId=it.id;cargos.forEach(c=>{c.q=it.cargos[c.s]!=null?+it.cargos[c.s]:0});cargos[0].q=1;render();const m=document.getElementById('msg');m.textContent='Composição carregada.';m.className='msg ok'};
el.appendChild(d);
});
}
function salvarLocal(){
const dados=Object.fromEntries(cargos.map(c=>[c.s,c.q]));
const pessoas=totalPessoas();const total=cargos.reduce((a,c)=>a+c.q*c.v,0);
const registro={cargos:dados,salvoEm:new Date().toISOString()};
const arr=lerLista();
if(atualId){const ix=arr.findIndex(x=>x.id===atualId);if(ix>=0){arr[ix]={...arr[ix],...registro}}else{arr.unshift({id:atualId,...registro})}}
else{atualId='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);arr.unshift({id:atualId,...registro})}
arr.sort((a,b)=>new Date(b.salvoEm)-new Date(a.salvoEm));
gravarLista(arr);renderLista();
}
document.getElementById('zerar').onclick=()=>{if(!confirm('Tem certeza que deseja apagar tudo e recomeçar?'))return;cargos.forEach(c=>c.q=0);cargos[0].q=1;atualId=null;render()};
document.getElementById('salvar').onclick=()=>{
if(!confirm('Deseja salvar esta composição?'))return;
salvarLocal();
const msg=document.getElementById('msg');msg.textContent='Salva.';msg.className='msg ok';
};
(function inicializar(){
let arr=lerLista();
if(arr.length===0){try{const antigo=JSON.parse(localStorage.getItem('composicao-diego-martins')||'null');if(antigo&&antigo.cargos){arr=[{id:'c'+Date.now().toString(36),cargos:antigo.cargos,salvoEm:antigo.salvoEm||new Date().toISOString()}];gravarLista(arr);localStorage.removeItem('composicao-diego-martins')}}catch(e){}}
if(arr.length>0){const s=arr[0];atualId=s.id;cargos.forEach(c=>{if(s.cargos[c.s]!=null)c.q=+s.cargos[c.s]})}
renderLista();
})();

/* ===== PDF — mesmo modelo de generateCabinetCompositionPDF, sem login/e-mail e sem homologação RH ===== */
async function carregarLogo(){
try{const r=await fetch('/logo.png');if(!r.ok)return null;const b=await r.blob();return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)});}catch(e){console.warn('logo',e);return null}
}
window.__gerarPDF = async function gerarPDF(){
if(invalido()){const m=document.getElementById('msg');m.textContent='Composição inválida.';m.className='msg err';return}
const btn=document.getElementById('pdf');btn.disabled=true;btn.textContent='Gerando...';
try{
if(!window.jspdf){throw new Error('jsPDF não carregou')}
const { jsPDF }=window.jspdf;
const doc=new jsPDF({compress:true});
const pageWidth=doc.internal.pageSize.getWidth();
const pageHeight=doc.internal.pageSize.getHeight();
const logo=await carregarLogo();
if(logo){try{doc.addImage(logo,'PNG',15,10,28,0)}catch(e){}}
doc.setDrawColor(200,200,200);doc.setLineWidth(0.5);doc.line(46,10,46,30);
doc.setTextColor(0,0,0);doc.setFont('helvetica','bold');doc.setFontSize(10.5);
doc.text('FORMULÁRIO DE ESCOLHA DE COMPOSIÇÃO DE GABINETE PARLAMENTAR',52,16);
doc.text('LEI MUNICIPAL Nº 16.546/2025',52,21);
doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.text('Câmara Municipal de Curitiba',52,27);
let y=45;
doc.setFont('helvetica','bold');doc.setFontSize(10);
doc.text('EXCELENTÍSSIMO SENHOR PRESIDENTE DA COMISSÃO EXECUTIVA,',15,y);y+=10;
doc.setFont('helvetica','normal');doc.setFontSize(9.5);
const intro='O(A) Vereador(a) DIEGO MARTINS, na escolha da organização de seu Gabinete Parlamentar (GABINETE DO VEREADOR DIEGO MARTINS), nos termos do Art. 4º da Lei Municipal 16.546/2025, opta pela seguinte composição:';
const splitIntro=doc.splitTextToSize(intro,pageWidth-30);doc.text(splitIntro,15,y);y+=(splitIntro.length*5)+8;
const linhas=[];
cargos.forEach(c=>{for(let i=0;i<c.q;i++)linhas.push(c.s==='CC1'?'1 Chefe de Gabinete Parlamentar':'1 Assessor de Gabinete Parlamentar')});
linhas.forEach((texto,i)=>{
const simbolo=cargos.flatMap(c=>Array(c.q).fill(c.s))[i];
doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(0,0,0);
doc.text(texto,15,y);doc.setFont('helvetica','bold');doc.text(simbolo,pageWidth-15,y,{align:'right'});y+=5;
});
y+=3;
const total=cargos.reduce((a,c)=>a+c.q*c.v,0);
const pessoas=cargos.reduce((a,c)=>a+c.q,0);
doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(`Total: ${pessoas} pessoa(s) — R$ ${fmt(total)}`,15,y);y+=8;
doc.setFont('helvetica','italic');doc.setFontSize(7.5);doc.setTextColor(80,80,80);
const obs='Obs.: Nos termos do Art. 4º, §1º do respectivo diploma legal, o limite máximo de despesa com pessoal do gabinete com os cargos previstos deverá respeitar o somatório dos vencimentos dos cargos do CC-1 ao CC-6 mais dois cargos CC-7 (total de R$ 92.998,45).';
const splitObs=doc.splitTextToSize(obs,pageWidth-30);doc.text(splitObs,15,y);y+=(splitObs.length*3.5)+10;
doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(0,0,0);
const meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const agora=new Date();
doc.text(`Curitiba, ${String(agora.getDate()).padStart(2,'0')} de ${meses[agora.getMonth()]} de ${agora.getFullYear()}`,pageWidth-15,y,{align:'right'});y+=30;
// Campo para assinatura digital — linha + nome VER. <NOME>
doc.setDrawColor(0,0,0);doc.line(pageWidth/2-45,y,pageWidth/2+45,y);y+=5;
doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(0,0,0);doc.text('VER. DIEGO MARTINS',pageWidth/2,y,{align:'center'});y+=10;
doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.text('VENCIMENTOS VIGENTES CONFORME SÍMBOLO:',15,y);y+=3;
const venc=[
['CHEFE DE GABINETE PARLAMENTAR CC-1','R$ 18.599,66','ASSESSOR DE GABINETE PARLAMENTAR CC-6','R$ 8.266,53'],
['ASSESSOR DE GABINETE PARLAMENTAR CC-2','R$ 16.533,01','ASSESSOR DE GABINETE PARLAMENTAR CC-7','R$ 6.199,89'],
['ASSESSOR DE GABINETE PARLAMENTAR CC-3','R$ 14.466,48','ASSESSOR DE GABINETE PARLAMENTAR CC-8','R$ 4.133,19'],
['ASSESSOR DE GABINETE PARLAMENTAR CC-4','R$ 12.399,85','ASSESSOR DE GABINETE PARLAMENTAR CC-9','R$ 3.099,98'],
['ASSESSOR DE GABINETE PARLAMENTAR CC-5','R$ 10.333,14','','']];
const colW=[62,28,62,28];
const margem=15;
doc.setFontSize(6);
venc.forEach(row=>{
const h=7;
row.forEach((cell,ci)=>{
const xo=margem+colW.slice(0,ci).reduce((a,b)=>a+b,0);
doc.setDrawColor(0,0,0);doc.setLineWidth(0.2);doc.rect(xo,y,colW[ci],h);
});
row.forEach((cell,ci)=>{
if(!cell)return;
const xo=margem+colW.slice(0,ci).reduce((a,b)=>a+b,0);
doc.setTextColor(0,0,0);
if(ci%2===0){doc.setFont('helvetica','bold');doc.text(cell,xo+2,y+4.5,{align:'left',maxWidth:colW[ci]-3})}
else{doc.setFont('helvetica','normal');doc.text(cell,xo+colW[ci]-2,y+4.5,{align:'right',maxWidth:colW[ci]-3})}
});
y+=h;
});
// Sem rodapé de homologação RH — apenas paginação
doc.setFontSize(8);doc.setTextColor(150,150,150);doc.setFont('helvetica','normal');
doc.text('Página 1 de 1',pageWidth-20,pageHeight-10,{align:'right'});
doc.save('Estrutura_Gabinete_Diego_Martins.pdf');
const okm=document.getElementById('msg');okm.textContent='PDF gerado.';okm.className='msg ok';
}catch(err){const msg=document.getElementById('msg');msg.textContent='Erro ao gerar PDF: '+(err.message||err);msg.className='msg err';console.error(err)}
finally{btn.disabled=invalido();btn.textContent='Gerar PDF'}
}
document.getElementById('pdf').onclick=()=>{if(!confirm('Deseja salvar e gerar o PDF?'))return;salvarLocal();window.__gerarPDF()};
render();
</script>
</body>
</html>
